name: Build and Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: jdx/mise-action@v2

      - name: Install Python dependencies
        run: uv sync

      - name: Refresh Google Scholar data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: mise run fetch-pubs

      - name: Generate CV data
        run: mise run generate-cv-data

      - name: Commit refreshed Google Scholar data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/scholar.json cv/data.typ
          git diff --cached --quiet || git commit -m "Update Google Scholar data"
          git push

      - name: Build CVs
        run: mise run build-cv

      - name: Freeze static site
        run: mise run freeze

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
